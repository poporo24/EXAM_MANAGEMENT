<!-- Universal Change Password Modal -->
<style>

}

}
#change-password-modal .ucp-form {
    padding: 20px 24px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 16px !important;
    margin: 0 !important;
    background: #ffffff !important;
}
#change-password-modal .ucp-label {
    display: block !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: #374151 !important;
    margin-bottom: 6px !important;
    text-align: left !important;
}
#change-password-modal .ucp-label span {
    font-size: 11px !important;
    font-weight: 400 !important;
    color: #9ca3af !important;
}
#change-password-modal .ucp-input-wrap {
    position: relative !important;
    width: 100% !important;
}
#change-password-modal .ucp-input {
    display: block !important;
    width: 100% !important;
    border: 1px solid #d1d5db !important;
    border-radius: 8px !important;
    padding: 10px 42px 10px 14px !important;
    font-size: 14px !important;
    line-height: 1.4 !important;
    color: #111827 !important;
    background: #ffffff !important;
    outline: none !important;
    transition: border-color 0.15s, box-shadow 0.15s !important;
    box-sizing: border-box !important;
}
#change-password-modal .ucp-input:focus {
    border-color: #668054 !important;
    box-shadow: 0 0 0 3px rgba(102, 128, 84, 0.2) !important;
}
#change-password-modal .ucp-eye-btn {
    position: absolute !important;
    top: 50% !important;
    right: 10px !important;
    transform: translateY(-50%) !important;
    background: transparent !important;
    border: none !important;
    color: #9ca3af !important;
    cursor: pointer !important;
    padding: 6px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 15px !important;
    line-height: 1 !important;
    transition: color 0.15s !important;
}
#change-password-modal .ucp-eye-btn:hover {
    color: #4b5563 !important;
}
#change-password-modal #ucp_match_err.hidden,
#change-password-modal #ucp_match_err[style*="display: none"] {
    display: none !important;
}
#change-password-modal #ucp_match_err:not(.hidden) {
    display: flex !important;
}
#change-password-modal #ucp_match_err {
    margin-top: 6px !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    color: #dc2626 !important;
    align-items: center !important;
    gap: 6px !important;
}
#change-password-modal .ucp-footer {
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 12px !important;
    padding-top: 10px !important;
}
#change-password-modal .ucp-btn-cancel {
    padding: 9px 18px !important;
    font-size: 13px !important;
    font-weight: 500 !important;
    color: #374151 !important;
    background: #ffffff !important;
    border: 1px solid #d1d5db !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    transition: background-color 0.15s, border-color 0.15s !important;
}
#change-password-modal .ucp-btn-cancel:hover {
    background: #f9fafb !important;
    border-color: #9ca3af !important;
}
#change-password-modal .ucp-btn-submit {
    padding: 9px 20px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: #ffffff !important;
    background: #5b734b !important;
    border: none !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    transition: background-color 0.15s !important;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
}
#change-password-modal .ucp-btn-submit:hover {
    background: #4a5e3d !important;
}
</style>

<div id="change-password-modal" class="ucp-modal fixed inset-0 z-50 hidden overflow-y-auto no-print" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="changePwModalTitle">
    <div class="flex items-center justify-center min-h-screen px-4 py-6 w-full">
        <!-- Backdrop -->
        <div class="ucp-backdrop fixed inset-0 bg-gray-900/60 backdrop-blur-xs transition-opacity cursor-pointer" onclick="closeChangePasswordModal()"></div>
        
        <!-- Modal Card -->
        <div class="ucp-card relative bg-white rounded-2xl shadow-2xl w-full max-w-md z-10 overflow-hidden border border-gray-100 transform transition-all">
            <!-- Header -->
            <div class="ucp-header flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <div class="flex items-center gap-2.5">
                    <span class="text-xl leading-none">🔑</span>
                    <h3 id="changePwModalTitle" class="ucp-title text-lg font-bold text-gray-900">Change Password</h3>
                </div>
                <button type="button" onclick="closeChangePasswordModal()" class="ucp-close-btn text-gray-400 hover:text-gray-600 transition-colors p-1 cursor-pointer rounded-lg hover:bg-gray-100" title="Close">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Form -->
            <form action="/change_my_password" method="POST" id="universalChangePwForm" class="ucp-form px-6 py-5 space-y-4" onsubmit="return validateUniversalChangePw(this)">
                <!-- Current Password -->
                <div>
                    <label class="ucp-label block text-sm font-semibold text-gray-800 mb-1.5">Current Password</label>
                    <div class="ucp-input-wrap relative w-full">
                        <input type="password" name="current_password" id="ucp_current" required
                            class="ucp-input block w-full border border-gray-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#668054] focus:border-[#668054] placeholder-gray-400 transition-colors"
                            placeholder="Enter current password" autocomplete="current-password">
                        <button type="button" onclick="togglePasswordVisibility(this)" 
                            class="ucp-eye-btn absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
                            title="Toggle password visibility">
                            <i class="fa-regular fa-eye text-base"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label class="ucp-label block text-sm font-semibold text-gray-800 mb-1.5">
                        New Password <span class="text-xs font-normal text-gray-400">(min. 6 characters)</span>
                    </label>
                    <div class="ucp-input-wrap relative w-full">
                        <input type="password" name="new_password" id="ucp_new" required minlength="6"
                            class="ucp-input block w-full border border-gray-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#668054] focus:border-[#668054] placeholder-gray-400 transition-colors"
                            placeholder="Enter new password" autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility(this)" 
                            class="ucp-eye-btn absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
                            title="Toggle password visibility">
                            <i class="fa-regular fa-eye text-base"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label class="ucp-label block text-sm font-semibold text-gray-800 mb-1.5">Confirm New Password</label>
                    <div class="ucp-input-wrap relative w-full">
                        <input type="password" name="confirm_password" id="ucp_confirm" required minlength="6"
                            class="ucp-input block w-full border border-gray-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#668054] focus:border-[#668054] placeholder-gray-400 transition-colors"
                            placeholder="Re-enter new password" autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility(this)" 
                            class="ucp-eye-btn absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
                            title="Toggle password visibility">
                            <i class="fa-regular fa-eye text-base"></i>
                        </button>
                    </div>
                    <p id="ucp_match_err" class="hidden mt-1.5 text-xs text-red-600 font-medium flex items-center gap-1.5" style="display: none;">
                        <i class="fa-solid fa-circle-exclamation"></i> <span>Passwords do not match.</span>
                    </p>
                </div>

                <!-- Action Buttons -->
                <div class="ucp-footer flex items-center justify-end gap-3 pt-3">
                    <button type="button" onclick="closeChangePasswordModal()"
                        class="ucp-btn-cancel px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer shadow-2xs">
                        Cancel
                    </button>
                    <button type="submit"
                        class="ucp-btn-submit px-5 py-2 text-sm font-semibold text-white bg-[#5b734b] hover:bg-[#4d623f] rounded-lg transition-colors cursor-pointer shadow-xs focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#668054]">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openChangePasswordModal() {
        const modal = document.getElementById('change-password-modal');
        if (modal) {
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            const curInput = document.getElementById('ucp_current');
            if (curInput) setTimeout(() => curInput.focus(), 60);
        }
    }

    function closeChangePasswordModal() {
        const modal = document.getElementById('change-password-modal');
        if (modal) {
            modal.classList.add('hidden');
            modal.style.display = 'none';
            const form = document.getElementById('universalChangePwForm');
            if (form) form.reset();
            const err = document.getElementById('ucp_match_err');
            if (err) {
                err.classList.add('hidden');
                err.style.display = 'none';
            }
        }
    }

    function togglePasswordVisibility(btn) {
        const container = btn.parentElement;
        const input = container.querySelector('input');
        const icon = btn.querySelector('i');
        if (!input) return;
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    function validateUniversalChangePw(form) {
        const p1 = form.querySelector('[name=new_password]').value;
        const p2 = form.querySelector('[name=confirm_password]').value;
        const errEl = document.getElementById('ucp_match_err');
        if (p1 !== p2) {
            if (errEl) {
                errEl.classList.remove('hidden');
                errEl.style.display = 'flex';
            }
            return false;
        }
        if (errEl) {
            errEl.classList.add('hidden');
            errEl.style.display = 'none';
        }
        return true;
    }

    // Modal shim for openModal / closeModal triggers
    (function() {
        const origOpen = window.openModal;
        window.openModal = function(id) {
            if (id === 'change-password-modal' || id === 'studentPwModal') {
                openChangePasswordModal();
                return;
            }
            if (typeof origOpen === 'function') origOpen(id);
            else {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('hidden');
                    el.style.display = 'flex';
                }
            }
        };

        const origClose = window.closeModal;
        window.closeModal = function(id) {
            if (id === 'change-password-modal' || id === 'studentPwModal') {
                closeChangePasswordModal();
                return;
            }
            if (typeof origClose === 'function') origClose(id);
            else {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.add('hidden');
                    el.style.display = 'none';
                }
            }
        };

        window.openStudentPwModal = openChangePasswordModal;
        window.closeStudentPwModal = closeChangePasswordModal;
    })();
</script>
