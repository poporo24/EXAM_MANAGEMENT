<!-- Universal Change Password Modal -->
<div id="change-password-modal" class="fixed inset-0 z-50 hidden overflow-y-auto no-print" role="dialog" aria-modal="true" aria-labelledby="changePwModalTitle">
    <div class="flex items-center justify-center min-h-screen px-4 py-6">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-xs transition-opacity cursor-pointer" onclick="closeChangePasswordModal()"></div>
        
        <!-- Modal Card -->
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md z-10 overflow-hidden border border-gray-100 transform transition-all">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <div class="flex items-center gap-2.5">
                    <span class="text-xl leading-none">🔑</span>
                    <h3 id="changePwModalTitle" class="text-lg font-bold text-gray-900">Change Password</h3>
                </div>
                <button type="button" onclick="closeChangePasswordModal()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 cursor-pointer rounded-lg hover:bg-gray-100" title="Close">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Form -->
            <form action="/change_my_password" method="POST" id="universalChangePwForm" class="px-6 py-5 space-y-4" onsubmit="return validateUniversalChangePw(this)">
                <!-- Current Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-800 mb-1.5">Current Password</label>
                    <div class="relative w-full">
                        <input type="password" name="current_password" id="ucp_current" required
                            class="block w-full border border-gray-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#668054] focus:border-[#668054] placeholder-gray-400 transition-colors"
                            placeholder="Enter current password" autocomplete="current-password">
                        <button type="button" onclick="togglePasswordVisibility(this)" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
                            title="Toggle password visibility">
                            <i class="fa-regular fa-eye text-base"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-800 mb-1.5">
                        New Password <span class="text-xs font-normal text-gray-400">(min. 6 characters)</span>
                    </label>
                    <div class="relative w-full">
                        <input type="password" name="new_password" id="ucp_new" required minlength="6"
                            class="block w-full border border-gray-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#668054] focus:border-[#668054] placeholder-gray-400 transition-colors"
                            placeholder="Enter new password" autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility(this)" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
                            title="Toggle password visibility">
                            <i class="fa-regular fa-eye text-base"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-800 mb-1.5">Confirm New Password</label>
                    <div class="relative w-full">
                        <input type="password" name="confirm_password" id="ucp_confirm" required minlength="6"
                            class="block w-full border border-gray-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#668054] focus:border-[#668054] placeholder-gray-400 transition-colors"
                            placeholder="Re-enter new password" autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility(this)" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
                            title="Toggle password visibility">
                            <i class="fa-regular fa-eye text-base"></i>
                        </button>
                    </div>
                    <p id="ucp_match_err" class="hidden mt-1.5 text-xs text-red-600 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-exclamation"></i> <span>Passwords do not match.</span>
                    </p>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-end gap-3 pt-3">
                    <button type="button" onclick="closeChangePasswordModal()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer shadow-2xs">
                        Cancel
                    </button>
                    <button type="submit"
                        class="px-5 py-2 text-sm font-semibold text-white bg-[#5b734b] hover:bg-[#4d623f] rounded-lg transition-colors cursor-pointer shadow-xs focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#668054]">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openChangePasswordModal() {
        const modal = document.getElementById('change-password-modal');
        if (modal) {
            modal.classList.remove('hidden');
            const curInput = document.getElementById('ucp_current');
            if (curInput) setTimeout(() => curInput.focus(), 60);
        }
    }

    function closeChangePasswordModal() {
        const modal = document.getElementById('change-password-modal');
        if (modal) {
            modal.classList.add('hidden');
            const form = document.getElementById('universalChangePwForm');
            if (form) form.reset();
            const err = document.getElementById('ucp_match_err');
            if (err) err.classList.add('hidden');
        }
    }

    function togglePasswordVisibility(btn) {
        const container = btn.parentElement;
        const input = container.querySelector('input');
        const icon = btn.querySelector('i');
        if (!input) return;
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    function validateUniversalChangePw(form) {
        const p1 = form.querySelector('[name=new_password]').value;
        const p2 = form.querySelector('[name=confirm_password]').value;
        const errEl = document.getElementById('ucp_match_err');
        if (p1 !== p2) {
            if (errEl) errEl.classList.remove('hidden');
            return false;
        }
        if (errEl) errEl.classList.add('hidden');
        return true;
    }

    // Modal shim for openModal / closeModal triggers
    (function() {
        const origOpen = window.openModal;
        window.openModal = function(id) {
            if (id === 'change-password-modal' || id === 'studentPwModal') {
                openChangePasswordModal();
                return;
            }
            if (typeof origOpen === 'function') origOpen(id);
            else {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            }
        };

        const origClose = window.closeModal;
        window.closeModal = function(id) {
            if (id === 'change-password-modal' || id === 'studentPwModal') {
                closeChangePasswordModal();
                return;
            }
            if (typeof origClose === 'function') origClose(id);
            else {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            }
        };

        window.openStudentPwModal = openChangePasswordModal;
        window.closeStudentPwModal = closeChangePasswordModal;
    })();
</script>
