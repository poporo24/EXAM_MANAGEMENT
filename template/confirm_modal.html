<!-- Reusable Confirmation & Alert Modal -->
<div id="sysConfirmModal" class="fixed inset-0 z-[1000] hidden items-center justify-center bg-black/60 p-4 transition-all" role="dialog" aria-modal="true">
    <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-gray-100 transform transition-all animate-in fade-in zoom-in-95 duration-150">
        <!-- Header -->
        <div id="sysConfirmHeader" class="px-6 py-4 flex items-center justify-between text-white bg-red-600 transition-colors">
            <div class="flex items-center gap-3">
                <div id="sysConfirmIconWrap" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center flex-shrink-0">
                    <i id="sysConfirmIcon" class="fa-solid fa-triangle-exclamation text-base"></i>
                </div>
                <h3 id="sysConfirmTitle" class="text-base font-bold leading-tight">Confirmation</h3>
            </div>
            <button type="button" onclick="closeSysConfirmModal()" class="text-white/80 hover:text-white text-2xl leading-none focus:outline-none cursor-pointer">&times;</button>
        </div>

        <!-- Body -->
        <div class="p-6">
            <p id="sysConfirmMessage" class="text-sm font-medium text-gray-800 leading-relaxed"></p>
            <div id="sysConfirmSubContainer" class="mt-3 p-3 rounded-xl text-xs flex items-start gap-2.5 bg-red-50 text-red-900 border border-red-200 hidden">
                <i id="sysConfirmSubIcon" class="fa-solid fa-circle-info text-red-600 mt-0.5 flex-shrink-0 text-sm"></i>
                <span id="sysConfirmSub" class="leading-relaxed"></span>
            </div>

            <!-- Buttons -->
            <div class="mt-6 flex justify-end gap-3" id="sysConfirmBtnContainer">
                <button type="button" id="sysConfirmCancelBtn" onclick="closeSysConfirmModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 bg-white hover:bg-gray-50 transition cursor-pointer">
                    Cancel
                </button>
                <button type="button" id="sysConfirmSubmitBtn" class="px-4 py-2 rounded-lg text-xs font-bold text-white shadow-xs transition flex items-center gap-1.5 bg-red-600 hover:bg-red-700 cursor-pointer">
                    Confirm
                </button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    let _sysConfirmCallback = null;

    window.submitPostAction = function(url) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = url;
        const meta = document.querySelector('meta[name="csrf-token"]');
        const token = meta ? meta.getAttribute('content') : (window.csrfToken || '{{ csrf_token() }}');
        if (token) {
            const csrf = document.createElement('input');
            csrf.type = 'hidden';
            csrf.name = 'csrf_token';
            csrf.value = token;
            form.appendChild(csrf);
        }
        document.body.appendChild(form);
        form.submit();
    };

    window.closeSysConfirmModal = function() {
        const modal = document.getElementById('sysConfirmModal');
        if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
        _sysConfirmCallback = null;
    };

    window.showConfirmModal = function(options) {
        options = options || {};
        const type = options.type || 'danger';
        const isAlert = options.isAlert || false;

        const themeMap = {
            danger: {
                header: 'bg-red-600',
                icon: 'fa-solid fa-trash-can',
                subBg: 'bg-red-50 text-red-900 border-red-200',
                subIcon: 'fa-solid fa-triangle-exclamation text-red-600',
                btn: 'bg-red-600 hover:bg-red-700 text-white'
            },
            warning: {
                header: 'bg-amber-600',
                icon: 'fa-solid fa-triangle-exclamation',
                subBg: 'bg-amber-50 text-amber-900 border-amber-200',
                subIcon: 'fa-solid fa-circle-exclamation text-amber-600',
                btn: 'bg-amber-600 hover:bg-amber-700 text-white'
            },
            success: {
                header: 'bg-[#668054]',
                icon: 'fa-solid fa-circle-check',
                subBg: 'bg-green-50 text-green-900 border-green-200',
                subIcon: 'fa-solid fa-circle-check text-[#668054]',
                btn: 'bg-[#668054] hover:bg-[#526843] text-white'
            },
            info: {
                header: 'bg-blue-600',
                icon: 'fa-solid fa-circle-info',
                subBg: 'bg-blue-50 text-blue-900 border-blue-200',
                subIcon: 'fa-solid fa-circle-info text-blue-600',
                btn: 'bg-blue-600 hover:bg-blue-700 text-white'
            }
        };

        const theme = themeMap[type] || themeMap.danger;

        const headerEl = document.getElementById('sysConfirmHeader');
        const iconEl = document.getElementById('sysConfirmIcon');
        const titleEl = document.getElementById('sysConfirmTitle');
        const msgEl = document.getElementById('sysConfirmMessage');
        const subBox = document.getElementById('sysConfirmSubContainer');
        const subEl = document.getElementById('sysConfirmSub');
        const subIcon = document.getElementById('sysConfirmSubIcon');
        const cancelBtn = document.getElementById('sysConfirmCancelBtn');
        const submitBtn = document.getElementById('sysConfirmSubmitBtn');
        const modal = document.getElementById('sysConfirmModal');

        if (!modal) return false;

        headerEl.className = 'px-6 py-4 flex items-center justify-between text-white ' + theme.header;
        iconEl.className = options.icon || theme.icon;
        titleEl.textContent = options.title || (isAlert ? 'Notice' : 'Confirmation');
        msgEl.innerHTML = options.message || (isAlert ? 'Information' : 'Are you sure you want to proceed?');

        if (options.sub) {
            subEl.innerHTML = options.sub;
            subBox.className = 'mt-3 p-3 rounded-xl text-xs flex items-start gap-2.5 border ' + theme.subBg;
            subIcon.className = theme.subIcon + ' mt-0.5 flex-shrink-0 text-sm';
            subBox.classList.remove('hidden');
        } else {
            subBox.classList.add('hidden');
        }

        submitBtn.className = 'px-4 py-2 rounded-lg text-xs font-bold shadow-xs transition flex items-center gap-1.5 cursor-pointer ' + theme.btn;
        submitBtn.innerHTML = options.confirmText || (isAlert ? 'OK' : 'Confirm');

        if (isAlert) {
            cancelBtn.classList.add('hidden');
        } else {
            cancelBtn.classList.remove('hidden');
            cancelBtn.textContent = options.cancelText || 'Cancel';
        }

        _sysConfirmCallback = options.onConfirm || null;

        modal.classList.remove('hidden');
        modal.classList.add('flex');
    };

    window.showAlertModal = function(message, title, type) {
        showConfirmModal({
            title: title || 'Notice',
            message: message,
            type: type || 'warning',
            isAlert: true,
            confirmText: 'Understood'
        });
    };

    document.addEventListener('DOMContentLoaded', function() {
        const submitBtn = document.getElementById('sysConfirmSubmitBtn');
        if (submitBtn) {
            submitBtn.addEventListener('click', function() {
                const cb = _sysConfirmCallback;
                closeSysConfirmModal();
                if (cb) cb();
            });
        }
        const modal = document.getElementById('sysConfirmModal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeSysConfirmModal();
                }
            });
        }
    });
})();
</script>
