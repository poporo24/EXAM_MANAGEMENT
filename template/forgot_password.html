<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Forgot Password - CCA Exam Management System">
    <title>Forgot Password - CCA Exam Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyCjf-aMcch8I9thXy5Lw1QzWfUX3sOAwhE",
    authDomain: "cca-exam-system.firebaseapp.com",
    projectId: "cca-exam-system",
    storageBucket: "cca-exam-system.firebasestorage.app",
    messagingSenderId: "779356462475",
    appId: "1:779356462475:web:a9fae5792d5d73be45638e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.handleReset = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.getElementById('reset-btn');
    const oldText = btn.innerHTML;
    
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Sending...';
    btn.disabled = true;
    
    try {
        await sendPasswordResetEmail(auth, email);
        btn.innerHTML = oldText;
        btn.disabled = false;
        
        const successDiv = document.createElement('div');
        successDiv.className = 'p-4 rounded-md mb-6 text-sm bg-green-50 text-green-700 border border-green-200';
        successDiv.innerText = "Password reset email sent! Please check your inbox.";
        
        const form = document.getElementById('forgot-form');
        const existingMsg = form.previousElementSibling;
        if (existingMsg && existingMsg.className.includes('bg-')) {
            existingMsg.remove();
        }
        form.parentNode.insertBefore(successDiv, form);
        form.reset();
    } catch (error) {
        btn.innerHTML = oldText;
        btn.disabled = false;
        
        let msg = "Error sending email: " + error.message;
        if (error.code === 'auth/user-not-found') msg = "No user found with this email.";
        
        const errorDiv = document.createElement('div');
        errorDiv.className = 'p-4 rounded-md mb-6 text-sm bg-red-50 text-red-700 border border-red-200';
        errorDiv.innerText = msg;
        
        const form = document.getElementById('forgot-form');
        const existingMsg = form.previousElementSibling;
        if (existingMsg && existingMsg.className.includes('bg-')) {
            existingMsg.remove();
        }
        form.parentNode.insertBefore(errorDiv, form);
    }
  }
</script>


    <style>
        /* Mobile Responsive Overrides */
        @media (max-width: 768px) {
            #sidebar { width: 4rem !important; z-index: 50; }
            #main-content { margin-left: 4rem !important; width: calc(100% - 4rem) !important; }
            .nav-text { display: none !important; }
            
            /* Make ALL tables horizontally scrollable */
            table { display: block !important; width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
            th, td { white-space: nowrap !important; }
            
            /* Make modals scrollable if they overflow */
            .fixed.inset-0 > div { padding: 1rem; overflow-y: auto; max-height: 100vh; }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Automatically wrap all tables to make them horizontally scrollable on small screens
            document.querySelectorAll("table").forEach(function(table) {
                if (!table.parentElement.classList.contains("overflow-x-auto")) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "overflow-x-auto w-full";
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });
        });
    </script>
</head>
<body class="bg-[#f4f7f6] min-h-screen relative overflow-y-auto p-4 sm:p-8 flex flex-col text-gray-800">
    <div class="absolute inset-0 z-0 opacity-[0.03]" style="background-image: radial-gradient(#668054 2px, transparent 2px); background-size: 30px 30px;"></div>
    
    <div class="z-10 w-full max-w-md bg-white rounded-xl shadow-xl p-8 border border-gray-100 m-auto">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#f4f7f6] mb-4">
                <i class="fa-solid fa-lock text-3xl text-[#668054]"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Forgot Password</h1>
            <p class="text-sm text-gray-500 mt-2">Enter your email to receive a reset link</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-md mb-2 text-sm {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200{% elif category == 'warning' %}bg-yellow-50 text-yellow-700 border border-yellow-200{% elif category == 'info' %}bg-blue-50 text-blue-700 border border-blue-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form id="forgot-form" action="#" class="space-y-6" onsubmit="handleReset(event)">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" name="email" id="email" required class="focus:ring-[#668054] focus:border-[#668054] block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="you@cca.edu.ph">
                </div>
            </div>

            <div>
                <button type="submit" id="reset-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#668054] hover:bg-[#526a42] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#668054]">
                    Send Reset Link
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="/login" class="text-sm font-medium text-[#668054] hover:text-[#526a42]">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
            </a>
        </div>
    </div>
</body>
</html>
