<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Timetable - CCA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f4f7f6] min-h-screen flex items-center justify-center relative overflow-hidden text-gray-800">
    <!-- Background pattern -->
    <div class="absolute inset-0 z-0 opacity-[0.03]" style="background-image: radial-gradient(#668054 2px, transparent 2px); background-size: 30px 30px;"></div>
    
    <div class="z-10 w-full max-w-md bg-white rounded-xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#f4f7f6] mb-4">
                <i class="fa-solid fa-calendar-alt text-3xl text-[#668054]"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Student Timetable</h1>
            <p class="text-sm text-gray-500 mt-2">Select your assigned section to view your schedule</p>
        </div>

        <form action="/public/timetable" method="GET" class="space-y-6">
            <div>
                <label for="section" class="block text-sm font-medium text-gray-700">Your Section</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-users text-gray-400"></i>
                    </div>
                    <select name="section" id="section" required class="focus:ring-[#668054] focus:border-[#668054] block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-3 px-3 border outline-none bg-white">
                        <option value="">Select your section...</option>
                        {% for sec in sections %}
                        <option value="{{ sec }}">{{ sec }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#668054] hover:bg-[#829c74] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#668054] transition-colors">
                    <i class="fa-solid fa-magnifying-glass mr-2 mt-0.5"></i> View Schedule
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="/login" class="text-sm font-medium text-[#668054] hover:text-[#829c74]">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
            </a>
        </div>
    </div>
</body>
</html>
