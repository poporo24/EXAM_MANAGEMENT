<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for CCA Exam Management System">
    <title>Register - CCA Exam Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <style>
        /* Mobile Responsive Overrides */
        @media (max-width: 768px) {
            #sidebar { width: 4rem !important; z-index: 50; }
            #main-content { margin-left: 4rem !important; width: calc(100% - 4rem) !important; }
            .nav-text { display: none !important; }
            
            /* Make ALL tables horizontally scrollable */
            table { display: block !important; width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
            th, td { white-space: nowrap !important; }
            
            /* Make modals scrollable if they overflow */
            .fixed.inset-0 > div { padding: 1rem; overflow-y: auto; max-height: 100vh; }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Automatically wrap all tables to make them horizontally scrollable on small screens
            document.querySelectorAll("table").forEach(function(table) {
                if (!table.parentElement.classList.contains("overflow-x-auto")) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "overflow-x-auto w-full";
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });
        });
    </script>
</head>
<body class="bg-[#f4f7f6] min-h-screen flex items-center justify-center relative overflow-hidden text-gray-800 py-10">
    <!-- Background pattern -->
    <div class="absolute inset-0 z-0 opacity-[0.03]" style="background-image: radial-gradient(#668054 2px, transparent 2px); background-size: 30px 30px;"></div>
    
    <div class="z-10 w-full max-w-md bg-white rounded-xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-[#f4f7f6] mb-4">
                <i class="fa-solid fa-user-plus text-2xl text-[#668054]"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Create an Account</h1>
            <p class="text-sm text-gray-500 mt-2">Join the CCA Exam Management System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-md mb-2 text-sm {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST" class="space-y-5">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input type="text" name="first_name" id="first_name" required class="focus:ring-[#668054] focus:border-[#668054] block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="John Paul">
                    </div>
                </div>
                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input type="text" name="last_name" id="last_name" required class="focus:ring-[#668054] focus:border-[#668054] block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="Baltazar">
                    </div>
                </div>
                <div>
                    <label for="middle_name" class="block text-sm font-medium text-gray-700">Middle Name <span class="text-xs text-gray-400">(Optional)</span></label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input type="text" name="middle_name" id="middle_name" class="focus:ring-[#668054] focus:border-[#668054] block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="Santos">
                    </div>
                </div>
                <div>
                    <label for="suffix" class="block text-sm font-medium text-gray-700">Suffix <span class="text-xs text-gray-400">(Optional)</span></label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input type="text" name="suffix" id="suffix" class="focus:ring-[#668054] focus:border-[#668054] block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="Jr., III">
                    </div>
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" name="email" id="email" required pattern=".*@cca\.edu\.ph$" title="Must be a valid @cca.edu.ph email address" class="focus:ring-[#668054] focus:border-[#668054] block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="student@cca.edu.ph">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" name="password" id="password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" title="Password must be at least 8 characters long and contain at least one uppercase letter and one number." class="focus:ring-[#668054] focus:border-[#668054] block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700">Account Type</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <select name="role" id="role" onchange="toggleSection()" required class="focus:ring-[#668054] focus:border-[#668054] block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border">
                        <option value="student">Student</option>
                        <option value="proctor">Proctor / Instructor</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div id="section_container">
                    <label for="section" class="block text-sm font-medium text-gray-700">Section</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input type="text" name="section" id="section" class="focus:ring-[#668054] focus:border-[#668054] block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="e.g. BSCS-1A">
                    </div>
                </div>
                <div>
                    <label for="institute_id" class="block text-sm font-medium text-gray-700">Institute</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <select name="institute_id" id="institute_id" required class="focus:ring-[#668054] focus:border-[#668054] block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border">
                            <option value="">Select...</option>
                            {% for inst in institutes %}
                            <option value="{{ inst.id }}">{{ inst.name }} ({{ inst.code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <script>
                function toggleSection() {
                    const role = document.getElementById('role').value;
                    const sectionContainer = document.getElementById('section_container');
                    const sectionInput = document.getElementById('section');
                    if (role === 'proctor') {
                        sectionContainer.style.display = 'none';
                        sectionInput.value = '';
                    } else {
                        sectionContainer.style.display = 'block';
                    }
                }
            </script>

            <div class="pt-2">
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#668054] hover:bg-[#829c74] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#668054] transition-colors">
                    Register Account
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Already have an account? 
                <a href="/login" class="font-medium text-[#668054] hover:text-[#829c74]">Sign in here</a>
            </p>
        </div>
    </div>
</body>
</html>
