<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset Password - CCA Exam Management System">
    <title>Reset Password - CCA Exam Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <style>
        /* Mobile Responsive Overrides */
        @media (max-width: 768px) {
            #sidebar { width: 4rem !important; z-index: 50; }
            #main-content { margin-left: 4rem !important; width: calc(100% - 4rem) !important; }
            .nav-text { display: none !important; }
            
            /* Make ALL tables horizontally scrollable */
            table { display: block !important; width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
            th, td { white-space: nowrap !important; }
            
            /* Make modals scrollable if they overflow */
            .fixed.inset-0 > div { padding: 1rem; overflow-y: auto; max-height: 100vh; }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Automatically wrap all tables to make them horizontally scrollable on small screens
            document.querySelectorAll("table").forEach(function(table) {
                if (!table.parentElement.classList.contains("overflow-x-auto")) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "overflow-x-auto w-full";
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });
        });
    </script>
</head>
<body class="bg-[#f4f7f6] min-h-screen relative overflow-y-auto p-4 sm:p-8 flex flex-col text-gray-800">
    <div class="absolute inset-0 z-0 opacity-[0.03]" style="background-image: radial-gradient(#668054 2px, transparent 2px); background-size: 30px 30px;"></div>
    
    <div class="z-10 w-full max-w-md bg-white rounded-xl shadow-xl p-8 border border-gray-100 m-auto">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#f4f7f6] mb-4">
                <i class="fa-solid fa-key text-3xl text-[#668054]"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Create New Password</h1>
            <p class="text-sm text-gray-500 mt-2">Enter a new secure password</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-md mb-2 text-sm {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/reset_password/{{ token }}" method="POST" class="space-y-6">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">New Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none z-10">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <div class="relative w-full"><input type="password" name="password" id="password" required minlength="6" class="focus:ring-[#668054] focus:border-[#668054] block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 px-3 border pr-10" placeholder="••••••••"><div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePassword(this)">
    <i class="fa-regular fa-eye text-gray-400 hover:text-gray-600"></i>
</div></div>
                </div>
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none z-10">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <div class="relative w-full"><input type="password" name="confirm_password" id="confirm_password" required minlength="6" class="focus:ring-[#668054] focus:border-[#668054] block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 px-3 border pr-10" placeholder="••••••••"><div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePassword(this)">
    <i class="fa-regular fa-eye text-gray-400 hover:text-gray-600"></i>
</div></div>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#668054] hover:bg-[#526a42] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#668054]">
                    Reset Password
                </button>
            </div>
        </form>
    </div>

<script>
    function togglePassword(btn) {
        const container = btn.parentElement;
        const input = container.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>

</body>
</html>
