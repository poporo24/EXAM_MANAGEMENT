<!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 fixed h-full w-64 sidebar-transition z-20 flex flex-col">
        <div class="h-16 w-full flex items-center justify-between px-4 border-b border-gray-200 sidebar-header-container">
            <div class="flex-1 flex items-center gap-3 overflow-hidden whitespace-nowrap nav-text">
                <i class="fa-solid fa-graduation-cap text-2xl text-[#668054]"></i>
                <span class="font-bold text-lg">CCA Exams</span>
            </div>
            <button onclick="toggleSidebar()" class="text-gray-500 hover:text-[#668054] focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a href="/secretary" class="flex items-center px-4 py-3 group {% if active_page == 'dashboard' %}bg-green-50 text-[#668054] border-r-4 border-[#668054]{% else %}text-gray-600 hover:bg-gray-50 hover:text-[#668054]{% endif %}" title="Exam Collection">
                <i class="fa-solid fa-inbox w-6 text-center text-lg"></i>
                <span class="ml-3 nav-text font-medium">Exam Collection</span>
            </a>
            <a href="/reports" class="flex items-center px-4 py-3 group {% if active_page == 'reports' %}bg-green-50 text-[#668054] border-r-4 border-[#668054]{% else %}text-gray-600 hover:bg-gray-50 hover:text-[#668054]{% endif %}" title="Reports">
                <i class="fa-solid fa-chart-pie w-6 text-center text-lg"></i>
                <span class="ml-3 nav-text font-medium">Reports</span>
            </a>
            <a href="/notifications" class="flex items-center px-4 py-3 group {% if active_page == 'notifications' %}bg-green-50 text-[#668054] border-r-4 border-[#668054]{% else %}text-gray-600 hover:bg-gray-50 hover:text-[#668054]{% endif %}" title="Notifications">
                <i class="fa-solid fa-bell w-6 text-center text-lg relative">
                    {% if unread_count and unread_count > 0 %}
                    <span class="absolute top-0 right-0 -mt-1 -mr-1 flex h-2 w-2">
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    {% endif %}
                </i>
                <span class="ml-3 nav-text font-medium">Notifications</span>
            </a>
        </nav>

        <div class="border-t border-gray-200 p-4">
                          <div class="flex items-center mb-3 overflow-hidden whitespace-nowrap">
                  <div class="w-8 h-8 rounded-full bg-[#829c74] text-white flex items-center justify-center font-bold uppercase">
                      {{ session.get('full_name', 'S')[:1] }}
                  </div>
                  <div class="ml-3 nav-text">
                      <p class="text-sm font-medium text-gray-900 truncate w-40" title="{{ session.get('full_name', 'College Secretary') }}">{{ session.get('full_name', 'College Secretary') }}</p>
                      <p class="text-xs text-gray-500">College Secretary</p>
                  </div>
              </div>
            <button onclick="openModal('change-password-modal')" class="flex items-center text-gray-600 hover:text-[#668054] group w-full mb-2" title="Change Password">
                <i class="fa-solid fa-key w-6 text-center text-lg"></i>
                <span class="ml-3 nav-text font-medium">Change Password</span>
            </button>
            <a href="/logout" class="flex items-center text-gray-600 hover:text-red-600 group w-full" title="Logout">
                <i class="fa-solid fa-sign-out-alt w-6 text-center text-lg"></i>
                <span class="ml-3 nav-text font-medium">Logout</span>
            </a>
        </div>
    </aside>
